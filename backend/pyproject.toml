[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "2lu3", email = "hi2lu3@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "dicebear-core>=10.3.0",
    "dicebear-styles>=10.2.0",
    "fastapi[standard]>=0.136.3",
    "firebase-admin>=7.4.0",
    "google-cloud-storage>=3.11.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "loguru>=0.7.3",
    "pre-commit>=4.6.0",
    "psycopg2>=2.9.12",
    "pydantic-settings>=2.14.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "sqlmodel>=0.0.38",
    "testcontainers[postgres]>=4.14.2",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
