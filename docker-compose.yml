# ローカル開発用フルスタック構成
# 本番の Google Cloud (Cloud SQL / Cloud Storage / Firebase Auth) に接続する。
#   backend  : FastAPI アプリ (backend/.env を参照)
#   frontend : react-router (vite) dev サーバ (frontend/.env を参照)
#
# 事前準備:
#   1. backend/.env に本番 Cloud SQL / GCS の接続情報を設定
#   2. backend/ServiceAccountKey.json を配置
#   3. frontend/.env.example を frontend/.env にコピーして Firebase 設定を記入

services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      FRONTEND_URL: http://localhost:5173
      GOOGLE_APPLICATION_CREDENTIALS: /credentials/ServiceAccountKey.json
    volumes:
      - ./backend/ServiceAccountKey.json:/credentials/ServiceAccountKey.json:ro
    command:
      - "sh"
      - "-c"
      - "uv run alembic upgrade head && uv run fastapi run src/backend/main.py --host 0.0.0.0 --port 8080"
    ports:
      - "8080:8080"
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file:
      - ./frontend/.env
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend
